<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>반야심경(般若心經) 타자 연습</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">

<!--
  필요한 파일 (이 html과 같은 폴더에 두세요)
  1.png 2.png 3.png : 메인 캐릭터 (귀 막은 / 눈 가린 / 입 가린)
  4.png             : 목탁 (타자 창으로 이동)
  5.png             : 헤드폰 부처 (선택한 색으로 칠해짐)
  6.png             : 완료 화면 배경
  7.png             : 완료 화면 LP판
  banya.mp3         : 타자 칠 때 나오는 음원
-->

<style>
/* ───────── 기본 ───────── */
:root{
  --c:#6aa385;                 /* 사용자가 고른 색 (JS가 변경) */
  --gray:#b5b5b5;              /* 아직 안 친 글자 */
  --sans:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --serif:'Noto Serif KR','Nanum Myeongjo','Apple SD Gothic Neo',serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#fff;color:#111;font-family:var(--sans);overflow-x:hidden;transition:background .35s}
body.dim{background:#d3d3d3}
.screen{display:none}
.screen.on{display:block}

/* ───────── 1. 메인 ───────── */
#home{position:relative;height:100vh;overflow:hidden}
.stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5vh}
.stage h1{font-size:clamp(13px,1.1vw,17px);font-weight:700;letter-spacing:.02em}
.chars{display:flex;gap:clamp(24px,5vw,80px)}
.chars img{display:block;width:clamp(64px,7vw,130px);opacity:.55;cursor:pointer;transition:opacity .3s,transform .3s}
.chars img.act{opacity:1;transform:scale(1.04)}
#ear{display:block;width:clamp(60px,6vw,110px);margin-top:2vh;opacity:.8;cursor:pointer;transition:opacity .3s}
#ear:hover{opacity:1}

#bubble{position:absolute;z-index:5;display:none;padding:16px 28px;border-radius:12px;background:#fff;box-shadow:0 2px 10px #0001;font-weight:700;font-size:clamp(12px,1vw,16px);white-space:nowrap}
#bubble::after{content:"";position:absolute;left:var(--arrow,50%);width:14px;height:14px;background:#fff;transform:translateX(-50%) rotate(45deg)}
#bubble.below::after{top:-7px}
#bubble.above::after{bottom:-7px}

/* 물방울 파동 + 디졸브 */
#ripple{position:fixed;inset:0;width:100%;height:100%;z-index:70;pointer-events:none}
#typing.fade{position:fixed;inset:0;z-index:60;overflow:hidden;background:#fff;opacity:0;transition:opacity 1.3s ease}
#typing.fade.go{opacity:1}

/* ───────── 2. 타자 창 ───────── */
#typing{position:relative;min-height:100vh}

#bar{position:fixed;top:0;left:0;right:0;z-index:20;height:76px;display:flex;align-items:center;gap:clamp(14px,2vw,32px);padding:calc(22px + env(safe-area-inset-top,0px)) 28px 14px;background:linear-gradient(#fff 70%,#fff0)}
#bar input[type=range]{-webkit-appearance:none;appearance:none;width:clamp(110px,18vw,300px);height:18px;background:transparent;cursor:pointer}
#bar input::-webkit-slider-runnable-track{height:2px;background:#9a9a9a}
#bar input::-moz-range-track{height:2px;background:#9a9a9a}
#bar input::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;margin-top:-5px;border:0;border-radius:50%;background:var(--c)}
#bar input::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--c)}
#apply{padding:4px 14px;border:0;border-radius:99px;background:var(--c);color:#fff;font:700 12px var(--sans);cursor:pointer}

#pill{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;z-index:25;display:none;transform:translateX(-50%);padding:3px 12px;border-radius:99px;background:#111;color:#fff;font:700 11px var(--sans)}
#stats{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:34px;z-index:20;display:none;gap:clamp(18px,2.4vw,40px);padding:2px 0 2px 16px;background:#fff;color:var(--c);font:700 clamp(22px,2.6vw,40px) var(--sans);font-variant-numeric:tabular-nums}

#bud{position:fixed;right:0;bottom:0;z-index:1;height:min(88vh,calc(42vw * 1158 / 1076));width:auto;pointer-events:none;filter:url(#tint)}   /* 5.png를 고른 색으로 */

#text{position:relative;z-index:2;width:58vw;padding:96px 0 120px 4vw;font-family:var(--serif);line-height:1.75;word-break:keep-all;overflow-wrap:anywhere}
#text .line{min-height:1em;margin-bottom:.45em}
#text .line.title{margin-bottom:1.1em;font-weight:700}
#text span{color:var(--gray)}
#text span.ok{color:#000;font-weight:700}
#text span.bad{color:#e02020;font-weight:700}
#text span.cur{color:var(--c);font-weight:700;border-bottom:3px solid var(--c)}
#input{position:fixed;left:-9999px;top:0;width:10px;height:10px;opacity:0}

/* ───────── 3. 완료 화면 ───────── */
#end{position:fixed;inset:0;z-index:50;background:#2a6fb3 url(6.png) center/cover;color:#fff}
#lp{--S:min(84vh,66vw);position:absolute;left:0;top:50%;width:var(--S);height:var(--S);margin-top:calc(var(--S) / -2);isolation:isolate;animation:spin 14s linear infinite}
#lp img{display:block;width:100%;height:100%}
#lp i{position:absolute;left:29.6%;top:29.6%;width:40.8%;height:40.8%;border-radius:50%;background:var(--c);mix-blend-mode:lighten}   /* 7.png 안쪽 흰 원의 검은 부분만 색칠 */
@keyframes spin{to{transform:rotate(360deg)}}
#result{position:absolute;left:52vw;top:50%;max-width:38vw;transform:translateY(-50%)}
#result h2{font:700 clamp(28px,3.6vw,56px) var(--sans)}
#result p{margin:14px 0 22px;font-size:clamp(11px,.95vw,15px);line-height:1.7}
#result button{padding:6px 16px;border:0;border-radius:99px;background:#fff;color:#111;font:700 13px var(--sans);cursor:pointer}

@media (max-width:700px){
  #lp{--S:90vw;left:5vw;top:4vh;margin-top:0;animation:none}
  #result{left:6vw;top:auto;bottom:6vh;max-width:88vw;transform:none}
}
</style>
</head>

<body>
<!-- 5.png / 7.png 색칠용 필터 (JS가 색을 바꿈) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="tint" color-interpolation-filters="sRGB">
    <feColorMatrix id="tintMatrix" type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.64  0 0 0 0 0.52  -0.2126 -0.7152 -0.0722 1 0"/>
  </filter>
</svg>

<!-- 1. 메인 -->
<section id="home" class="screen on">
  <div class="stage">
    <h1>반야심경(般若心經)</h1>
    <div class="chars">
      <img src="1.png" data-i="0" alt="">
      <img src="2.png" data-i="1" alt="">
      <img src="3.png" data-i="2" alt="">
    </div>
    <img id="ear" src="4.png" alt="타자 시작">
  </div>
  <div id="bubble"></div>
</section>

<!-- 2. 타자 창 -->
<section id="typing" class="screen">
  <div id="bar">
    <input id="sizeSlider"  type="range" min="0" max="100" value="0" aria-label="글자 크기">
    <input id="colorSlider" type="range" min="0" max="15" step="1" value="5" aria-label="색상">
    <button id="apply">적용</button>
  </div>
  <div id="pill">마음을 써서 시작하세요!</div>
  <div id="stats"><span id="cpm">현재 타수: 0</span><span id="clock">00:00:00</span></div>
  <img id="bud" src="5.png" alt="">
  <div id="text"></div>
  <textarea id="input" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
</section>

<!-- 3. 완료 화면 -->
<section id="end" class="screen">
  <div id="lp"><img src="7.png" alt=""><i></i></div>
  <div id="result">
    <h2 id="finalTime">0:00:00</h2>
    <p>빠르고 느림은 허공의 구름과 같으니, 마음에 두지 마옵소서.<br>한 자 한 자 끝까지 이르렀으니, 그것이 곧 수행이옵니다.</p>
    <button id="again">다시하기</button>
  </div>
</section>

<script>
/* ═════════════ 설정 (여기만 바꿔도 됩니다) ═════════════ */
const TYPING_AUDIO = 'banya.mp3';     // 타자 페이지 음원
const END_YOUTUBE  = 'e7Gdz_q4ZXw';   // 완료 페이지 음원(유튜브 영상 ID)
const BUBBLE_MS    = 2000;            // 캐릭터 말풍선 유지 시간
const MAX_SPEED    = 4;               // 배속 상한

// 색상 팔레트: 왼쪽 → 오른쪽이 슬라이더 min → max (마지막은 블랙)
const PALETTE = ['#e57373','#f0a35e','#f2c94c','#c5d86d','#8fcf8f','#6aa385','#4fb8a8','#5bc0de',
                 '#5b8def','#4a4ae0','#7c4dff','#b05fd8','#e06fb0','#8d6e63','#9e9e9e','#000000'];

const SUTRA = [
  '마하반야바라밀다심경','관자재보살','행심반야바라밀다시 조견오온개공 도일체고액','사리자',
  '색불이공 공불이색 색즉시공 공즉시색 수상행식 역부여시','사리자','시제법공상 불생불멸 불구부정 부증불감',
  '시고 공중무색 무수상행식','무안이비설신의 무색성향미촉법 무안계 내지 무의식계',
  '무무명 역무무명진 내지 무노사 역무노사진','무고집멸도 무지 역무득 이무소득고','보리살타 의반야바라밀다고',
  '심무가애 무가애고 무유공포 원리전도몽상 구경열반','삼세제불 의반야바라밀다고','득아뇩다라삼먁삼보리',
  '고지반야바라밀다 시대신주 시대명주 시무상주 시무등등주 능제일체고 진실불허',
  '고설반야바라밀다주 즉설주왈','아제아제 바라아제 바라승아제 모지 사바하'
];

const MESSAGES = [
  '반야심경을 마음에 새기며 한 자 한 자 두드려 보소서.',
  '글씨의 크기도, 마음 머무를 빛깔도 그대가 고르시옵소서.',
  '자판 위에서 반야를 두드리니, 마음이 절로 고요해지리라.'
];

// 타수 → 배속: 1~249 0.75 / 250~349 1 / 350~ 1.25, 이후 100타마다 +0.25
function speedFor(cpm){
  if (cpm < 250) return 0.75;
  if (cpm < 350) return 1;
  return Math.min(MAX_SPEED, 1.25 + 0.25 * Math.floor((cpm - 350) / 100));
}

/* ═════════════ 공통 ═════════════ */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const pad = n => String(n).padStart(2, '0');

function showScreen(id){ $$('.screen').forEach(el => el.classList.toggle('on', el.id === id)); }

function setColor(hex){                       // CSS 변수 + 5.png 필터 색 동시 변경
  document.documentElement.style.setProperty('--c', hex);
  const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255);
  $('#tintMatrix').setAttribute('values',
    `0 0 0 0 ${r}  0 0 0 0 ${g}  0 0 0 0 ${b}  -0.2126 -0.7152 -0.0722 1 0`);
}

/* ═════════════ 1. 메인: 캐릭터 · 말풍선 ═════════════ */
const chars  = $$('.chars img');
const bubble = $('#bubble');
let bubbleTimer;

function resetHome(){
  clearTimeout(bubbleTimer);
  document.body.classList.remove('dim');
  chars.forEach(c => c.classList.remove('act'));
  bubble.style.display = 'none';
}

chars.forEach(img => img.addEventListener('click', e => {
  e.stopPropagation();
  if (img.classList.contains('act')) return resetHome();     // 같은 캐릭터를 다시 누르면 복귀

  const i = +img.dataset.i, above = i === 1;                 // 가운데 캐릭터만 말풍선이 위
  document.body.classList.add('dim');
  chars.forEach(c => c.classList.toggle('act', c === img));

  bubble.textContent = MESSAGES[i];
  bubble.className = above ? 'above' : 'below';
  bubble.style.display = 'block';
  const r = img.getBoundingClientRect(), cx = r.left + r.width / 2;
  const w = bubble.offsetWidth, h = bubble.offsetHeight;
  const left = Math.max(12, Math.min(innerWidth - w - 12, cx - w / 2));
  bubble.style.left = left + 'px';
  bubble.style.top  = (above ? r.top - h - 16 : r.bottom + 16) + 'px';
  bubble.style.setProperty('--arrow', (cx - left) + 'px');

  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(resetHome, BUBBLE_MS);
}));
$('#home').addEventListener('click', resetHome);

/* ═════════════ 메인 → 타자 창: 물방울 파동 + 디졸브 ═════════════ */
let leaving = false;
$('#ear').addEventListener('click', e => {
  e.stopPropagation();
  if (leaving) return;
  leaving = true;
  resetHome();
  playRipple(e.currentTarget);
});

function playRipple(el){
  const box = el.getBoundingClientRect();
  const cx = box.left + box.width / 2, cy = box.top + box.height / 2;
  const dpr = devicePixelRatio || 1;

  const cv = document.createElement('canvas');
  cv.id = 'ripple'; cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  document.body.appendChild(cv);
  const g = cv.getContext('2d'); g.scale(dpr, dpr);

  const maxR = Math.hypot(Math.max(cx, innerWidth - cx), Math.max(cy, innerHeight - cy)) * 1.05;
  const page = $('#typing');
  const t0 = performance.now();
  let dissolving = false, swapped = false;

  (function frame(now){
    const t = now - t0;
    g.clearRect(0, 0, innerWidth, innerHeight);

    for (let k = 0; k < 4; k++){                         // 340ms 간격으로 4겹의 파동
      const tt = t - k * 340; if (tt <= 0) continue;
      const p = tt / 2200;    if (p >= 1) continue;
      const R = (1 - (1 - p) ** 2) * maxR, a = (1 - p) ** 1.4;

      for (let i = 0; i < 3; i++){                       // 한 파동 = 동심원 3줄 + 하이라이트
        const r = R - i * 13; if (r <= 0) continue;
        g.beginPath(); g.arc(cx, cy, r, 0, 7);
        g.lineWidth = 3.2 - i; g.strokeStyle = `rgba(70,85,110,${a * (.5 - i * .12)})`; g.stroke();
        g.beginPath(); g.arc(cx, cy, r + 2.5, 0, 7);
        g.lineWidth = 1.4; g.strokeStyle = `rgba(255,255,255,${a * .9})`; g.stroke();
      }
      const grad = g.createRadialGradient(cx, cy, Math.max(0, R - 36), cx, cy, R + 4);   // 물결 은은한 음영
      grad.addColorStop(0, 'rgba(120,140,170,0)');
      grad.addColorStop(.85, `rgba(120,140,170,${a * .12})`);
      grad.addColorStop(1, 'rgba(120,140,170,0)');
      g.fillStyle = grad; g.beginPath(); g.arc(cx, cy, R + 4, 0, 7); g.fill();
    }

    if (!dissolving && t > 600){                         // 0.6초: 타자 페이지가 위로 서서히 겹침
      dissolving = true;
      page.classList.add('fade', 'on'); layout(); paint();
      void page.offsetWidth; page.classList.add('go');
    }
    if (dissolving && !swapped && t > 2000){             // 2.0초: 정식 전환
      swapped = true;
      page.classList.remove('fade', 'go');
      showScreen('typing'); layout(); scrollTo(0, 0);
    }
    if (t < 3000) requestAnimationFrame(frame); else { cv.remove(); leaving = false; }
  })(t0);
}

/* ═════════════ 2. 타자 창: 글자 · 슬라이더 ═════════════ */
const textBox = $('#text'), sizeSlider = $('#sizeSlider'), colorSlider = $('#colorSlider'), input = $('#input');
const chars_ = [];                                        // 타자 대상 글자(공백 제외) span 목록

SUTRA.forEach((line, k) => {
  const div = document.createElement('div');
  div.className = 'line' + (k === 0 ? ' title' : '');
  [...line].forEach(ch => {
    const s = document.createElement('span'); s.textContent = ch; div.appendChild(s);
    if (ch !== ' ') chars_.push(s);
  });
  textBox.appendChild(div);
});
const TOTAL = chars_.length;

let fontMin = 12, fontMax = 40;
function layout(){
  // min: 전체 글이 화면 높이에 꽉 찰 때
  let lo = 6, hi = 60;
  for (let k = 0; k < 14; k++){
    const mid = (lo + hi) / 2; textBox.style.fontSize = mid + 'px';
    textBox.scrollHeight <= innerHeight ? lo = mid : hi = mid;
  }
  fontMin = lo;

  // max: 가장 긴 줄이 5.png에 걸치지 않고 한 줄에 들어가는 한계
  const colW = innerWidth * .58 - innerWidth * .04 - 8;
  const probe = document.createElement('span');
  probe.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;font:100px ' + getComputedStyle(textBox).fontFamily;
  document.body.appendChild(probe);
  let widest = 0; SUTRA.forEach(l => { probe.textContent = l; widest = Math.max(widest, probe.offsetWidth); });
  probe.remove();
  fontMax = Math.max(fontMin + 6, Math.min(colW / widest * 100, innerWidth * .05));
  applySize();
}
const applySize  = () => { textBox.style.fontSize = (fontMin + (fontMax - fontMin) * sizeSlider.value / 100) + 'px'; };
const applyColor = () => setColor(PALETTE[colorSlider.value]);

sizeSlider.oninput  = applySize;
colorSlider.oninput = applyColor;
addEventListener('resize', () => { if ($('#typing').classList.contains('on')) layout(); });
applyColor();

/* ═════════════ 타자 진행 ═════════════ */
let live = false, started = false, finished = false, composing = false;
let startTime = 0, strokes = 0, clockTimer, finishTimer;

$('#apply').onclick = () => {
  startAudio();
  live = true;
  $('#bar').style.display = 'none';
  $('#pill').style.display = 'block';
  $('#stats').style.display = 'flex';
  scrollTo(0, 0); input.value = ''; input.focus(); paint();
};
document.addEventListener('click', () => { if (live && !finished) input.focus(); });

input.addEventListener('compositionstart', () => { composing = true; });
input.addEventListener('compositionend',   () => { composing = false; paint(); });
input.addEventListener('input', paint);
input.addEventListener('keydown', e => {
  if (!live || finished) return;
  const isKey = e.key.length === 1 || e.key === 'Process';      // 한글 IME 입력은 'Process'
  if (isKey && !started){
    started = true; startTime = Date.now();
    $('#pill').style.display = 'none';
    clockTimer = setInterval(tick, 100);
  }
  if (isKey) strokes++;
});

function tick(){                                                // 시간 · 타수 · 배속 갱신
  const sec = (Date.now() - startTime) / 1000;
  $('#clock').textContent = pad(Math.floor(sec / 3600)) + ':' + pad(Math.floor(sec / 60) % 60) + ':' + pad(Math.floor(sec % 60));
  const cpm = Math.round(strokes / Math.max(sec, 1) * 60);
  $('#cpm').textContent = '현재 타수: ' + cpm;
  setSpeed(speedFor(cpm));
}

function paint(){                                               // 글자 색 갱신
  const typed = [...input.value.replace(/\s/g, '')].slice(0, TOTAL);
  chars_.forEach((s, i) => {
    s.className = '';
    if (composing && i === typed.length - 1) s.className = 'cur';          // 조합 중인 글자
    else if (i < typed.length)               s.className = typed[i] === s.textContent ? 'ok' : 'bad';
    else if (i === typed.length && !composing) s.className = 'cur';        // 다음 칠 글자
  });
  const cur = chars_[Math.min(typed.length, TOTAL - 1)];
  if (live && cur){
    const r = cur.getBoundingClientRect();
    if (r.bottom > innerHeight - 90 || r.top < 60) scrollBy({ top: r.top - innerHeight * .4, behavior: 'smooth' });
  }
  // 마지막 글자까지 치면 엔터 없이 자동 완료 (한글 조합 확정을 위해 잠깐 대기)
  clearTimeout(finishTimer);
  if (live && !finished && started && typed.length >= TOTAL) finishTimer = setTimeout(finish, composing ? 700 : 200);
}

/* ═════════════ 음원 ═════════════ */
let typingAudio, endFrame, lastSpeed = 0;

function postToYouTube(frame, func, args = []){
  try { frame.contentWindow.postMessage(JSON.stringify({ event: 'command', func, args }), '*'); } catch (e) {}
}
function startAudio(){
  typingAudio = new Audio(TYPING_AUDIO);
  typingAudio.loop = true; typingAudio.preservesPitch = true; typingAudio.playbackRate = .75;
  typingAudio.play().catch(() => {});
  // 완료 화면 음원은 미리 로드만 해 둠 (클릭 직후라 자동재생 허용)
  endFrame = document.createElement('iframe');
  endFrame.src = `https://www.youtube.com/embed/${END_YOUTUBE}?enablejsapi=1&controls=0&playsinline=1&rel=0&loop=1&playlist=${END_YOUTUBE}`;
  endFrame.allow = 'autoplay; encrypted-media'; endFrame.title = 'audio';
  endFrame.style.cssText = 'position:fixed;left:0;bottom:0;width:200px;height:200px;opacity:.01;pointer-events:none;z-index:-1;border:0';
  document.body.appendChild(endFrame);
  endFrame.addEventListener('load', () => endFrame.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 1, channel: 'widget' }), '*'));
}
function setSpeed(v){ if (v !== lastSpeed && typingAudio){ lastSpeed = v; typingAudio.playbackRate = v; } }
function playEndAudio(){
  if (typingAudio){ typingAudio.pause(); typingAudio = null; }
  const go = () => { postToYouTube(endFrame, 'setPlaybackRate', [1]); postToYouTube(endFrame, 'playVideo'); };
  go(); setTimeout(go, 800); setTimeout(go, 2000);
}

/* ═════════════ 3. 완료 ═════════════ */
function finish(){
  finished = true; clearInterval(clockTimer); input.blur(); playEndAudio();
  const s = Math.floor((Date.now() - startTime) / 1000);
  $('#finalTime').textContent = Math.floor(s / 3600) + ':' + pad(Math.floor(s / 60) % 60) + ':' + pad(s % 60);
  document.body.classList.remove('dim'); document.body.style.background = '#000';
  showScreen('end');
}
$('#again').onclick = () => location.reload();
</script>
